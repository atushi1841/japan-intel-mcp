name: Publish to MCP Registry
on:
  workflow_dispatch:
    inputs:
      deprecate_version:
        description: 'deprecated にする旧バージョン（空なら何もしない）'
        type: string
        default: ''
      publish:
        description: 'server.json を publish する'
        type: boolean
        default: true
      status_version:
        description: 'status を変更するバージョン（空なら何もしない）'
        type: string
        default: ''
      status_value:
        description: 'status_version に設定する値 (active|deprecated|deleted)'
        type: string
        default: ''
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL -o mp.tar.gz https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar xzf mp.tar.gz
          chmod +x mcp-publisher
      - name: Authenticate with registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Deprecate an old version
        if: ${{ inputs.deprecate_version != '' }}
        run: |
          mcp-publisher status --status deprecated \\
            --message "旧版（懸賞ツールを含む）。最新版を使用してください。" \\
            io.github.atushi1841/japan-intel-mcp ${{ inputs.deprecate_version }}
      - name: Set version status (active/deprecated/deleted)
        if: ${{ inputs.status_version != '' && inputs.status_value != '' }}
        run: |
          mcp-publisher status --status ${{ inputs.status_value }} \\
            --message "懸賞ツールを含む旧版のため非公開化" \\
            io.github.atushi1841/japan-intel-mcp ${{ inputs.status_version }}
      - name: Publish server.json
        if: ${{ inputs.publish }}
        run: ./mcp-publisher publish
